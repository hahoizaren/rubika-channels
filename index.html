<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>کانال‌یاب روبیکا</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 15px;
            background: #101010;
            color: white;
            font-family: sans-serif;
        }

        h1 {
            text-align: center;
            margin: 10px 0 25px;
        }

        #channels {
            max-width: 450px;
            margin: auto;
        }

        .channel {
            background: #202020;
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 18px;
            text-align: center;
        }

        .channel img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 20px;
        }

        .channel h2 {
            margin: 12px 0;
        }

        .channel button {
            border: 0;
            border-radius: 12px;
            padding: 12px 25px;
            background: #e91e63;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        #loading {
            text-align: center;
            color: #aaa;
        }

        #error {
            text-align: center;
            color: #ff7777;
        }
    </style>
</head>

<body>

    <h1>📱 کانال‌یاب روبیکا</h1>

    <div id="loading">
        در حال دریافت کانال‌ها...
    </div>

    <div id="error"></div>

    <div id="channels"></div>

    <script>

        fetch("data.json")
            .then(response => {
                if (!response.ok) {
                    throw new Error("خطا در دریافت اطلاعات");
                }

                return response.json();
            })

            .then(channels => {

                document.getElementById("loading").style.display = "none";

                const container = document.getElementById("channels");

                channels.forEach(channel => {

                    const card = document.createElement("div");

                    card.className = "channel";

                    card.innerHTML = `
                        <img src="${channel.image}" alt="کانال">

                        <h2>${channel.name}</h2>

                        <button onclick="openChannel('${channel.link}')">
                            ورود به کانال
                        </button>
                    `;

                    container.appendChild(card);

                });

            })

            .catch(error => {

                document.getElementById("loading").style.display = "none";

                document.getElementById("error").innerText =
                    "❌ دریافت اطلاعات با مشکل مواجه شد.";

                console.log(error);

            });


        function openChannel(link) {

            window.location.href = link;

        }

    </script>

</body>
</html>
