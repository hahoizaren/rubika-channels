<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>کانال‌یاب روبیکا</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 15px 40px;

            font-family: Tahoma, Arial, sans-serif;

            background:
                radial-gradient(circle at top, #35101f 0%, #101010 45%, #080808 100%);

            color: white;

            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 10px 0;
            font-size: 28px;
        }

        .header p {
            color: #aaa;
            margin: 0;
            font-size: 14px;
        }

        #loading {
            text-align: center;
            padding: 30px;
            color: #aaa;
        }

        #error {
            text-align: center;
            color: #ff6b81;
            padding: 20px;
        }

        #channels {
            max-width: 500px;
            margin: auto;
        }

        .channel {

            background: rgba(35, 35, 35, 0.9);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 22px;

            padding: 18px;

            margin-bottom: 18px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(10px);
        }

        .channel img {

            width: 110px;
            height: 110px;

            object-fit: cover;

            border-radius: 25px;

            display: block;

            margin: 0 auto 14px;

            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .channel h2 {

            margin: 8px 0 16px;

            font-size: 19px;
        }

        .channel button {

            width: 100%;

            border: none;

            border-radius: 14px;

            padding: 13px;

            background: linear-gradient(
                135deg,
                #e91e63,
                #ff416c
            );

            color: white;

            font-size: 16px;

            font-family: inherit;

            cursor: pointer;

            box-shadow:
                0 7px 20px rgba(233, 30, 99, 0.25);
        }

        .channel button:active {

            transform: scale(0.97);

        }

        .footer {

            text-align: center;

            color: #777;

            font-size: 12px;

            margin-top: 30px;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>📱 کانال‌یاب روبیکا</h1>

        <p>
            کانال‌های منتخب روبیکا
        </p>

    </div>


    <div id="loading">

        در حال دریافت کانال‌ها...

    </div>


    <div id="error"></div>


    <div id="channels"></div>


    <div class="footer">

        کانال‌یاب روبیکا

    </div>



<script>


    // دریافت اطلاعات کانال‌ها از data.json

    fetch("data.json")

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "خطا در دریافت data.json"
                );

            }

            return response.json();

        })


        .then(function(channels) {


            document.getElementById("loading")
                .style.display = "none";


            var container =
                document.getElementById("channels");


            // پاک کردن لیست قبلی

            container.innerHTML = "";


            // ساخت کارت برای هر کانال

            channels.forEach(function(channel) {


                var card =
                    document.createElement("div");


                card.className = "channel";


                // ساخت عکس

                var image =
                    document.createElement("img");

                image.src = channel.image;

                image.alt = channel.name;


                // اگر عکس لود نشد

                image.onerror = function() {

                    this.style.display = "none";

                };


                // نام کانال

                var title =
                    document.createElement("h2");

                title.innerText =
                    channel.name;


                // دکمه

                var button =
                    document.createElement("button");


                button.innerText =
                    "ورود به کانال 🚀";


                button.onclick = function() {

                    openChannel(channel.link);

                };


                // اضافه کردن به کارت

                card.appendChild(image);

                card.appendChild(title);

                card.appendChild(button);


                // اضافه کردن کارت به صفحه

                container.appendChild(card);


            });


        })


        .catch(function(error) {


            document.getElementById("loading")
                .style.display = "none";


            document.getElementById("error")
                .innerText =
                "❌ دریافت اطلاعات کانال‌ها انجام نشد";


            console.log(error);

        });



    // باز کردن لینک روبیکا

    function openChannel(link) {

        window.location.href = link;

    }


</script>


</body>

</html>
