<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کانال‌یاب روبیکا</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #111;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .channel {
            background: #222;
            border-radius: 18px;
            padding: 15px;
            margin: 15px auto;
            max-width: 400px;
        }

        .channel img {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            object-fit: cover;
        }

        .channel button {
            margin-top: 12px;
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            background: #e91e63;
            color: white;
            font-size: 15px;
        }
    </style>
</head>

<body>

<h1>📱 کانال‌یاب روبیکا</h1>

<div class="channel">

    <img src="https://via.placeholder.com/100">

    <h2>کانال نمونه</h2>

    <button onclick="openChannel()">
        ورود به کانال
    </button>

</div>

<script>
function openChannel() {
    window.location.href = "https://rubika.ir/";
}
</script>

</body>
</html>
